services:
  go:
    build: .
    image: go-prototype:local
    container_name: go-prototype
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8787"
    expose:
      - "8787"
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true
    name: web
